experiment:
  name: CR-CDiff_DiT_delta
  output_dir: saved_models/CR-CDiff_DiT_delta
  seed: 42

runtime:
  data_dir: data/out_combined_stereo
  gpu: 0
  resume: false
  amp: true
  cudnn_benchmark: true
  allow_tf32: true
  matmul_precision: high
  print_every: 300

data:
  inp_type: wav
  sr: 44100
  dur: 2
  context_dur: 10
  lufs: -24.0
  threshold: 0.0001
  t60_r: [0.4, 1.5]
  room_dim_r: [5, 15, 5, 15, 2, 6]
  min_distance_to_wall: 1.0
  aug_factor: 3
  hop: 384
  win: 1024
  fft: 1024
  win_fn: hann
  center: true
  rep_type: ri
  val_split: 0.2
  batch_size: 4

train:
  epochs: 200
  patience: 7
  gen_val_batch: true

  learning_rate: 1.0e-4
  beta1: 0.9
  beta2: 0.98
  eps: 1.0e-8
  weight_decay: 0.0
  ema_decay: 0.995
  grad_clip: 1.0

  optimizer:
    name: adamw
    fused: true

  lr_policy: fixed
  warmup_steps: 2000
  restart_epochs: 30
  warmup_initial_lr: 1.0e-6
  warmup_epochs: 3
  cosine_floor_factor: 1.0e-2

  diffusion_steps: 16
  diffusion_mode: linear
  alpha_mode: cos2
  residual_mode: next_delta_norm

  loss:
    delta_weight: 35.0
    recon_weight: 15.0
    spec_weight: 50.0
    audio_weight: 400.0
    timestep_reweight: true

model:
  backbone: dit

  in_chans: 4
  dropout: 0.0
  continuous_emb: false
  use_ckpt: true
  residual_prediction: true

  embed_dim: 768
  num_heads: 8
  num_layers: 5
  max_freq: 1000.0

  reinit_projection: true